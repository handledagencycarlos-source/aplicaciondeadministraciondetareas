<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpoQuest — Tu rutina como un juego</title>
<meta name="description" content="Organiza tu día como un juego: tareas, hábitos, límites, dinero y ligas.">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OpoQuest">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--card:#161a22;--card2:#1d222c;--line:#272d3a;--tx:#eef1f6;--mut:#8a93a6;--acc:#b6f24a;--acc2:#8b7bff;--red:#ff5a6a;--gold:#ffc94a;--blue:#4ac6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Space Grotesk',system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:14px}
h2{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:22px 0 10px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.hero{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#1b2030,#141821);border:1px solid var(--line);border-radius:20px;padding:16px}
.lvl{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;position:relative}
.lvl b{font-size:24px;line-height:1}.lvl small{font-size:9px;color:var(--mut);letter-spacing:.1em;display:block;text-align:center}
.bar{height:8px;background:#0a0c10;border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#e8ff8a);border-radius:9px;transition:width .4s}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.mut{color:var(--mut);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.pill.big{color:var(--gold);border-color:#5a4a1d;background:#2a2412}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:var(--mut)}
.task{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;transition:.2s}
.task.isbig{border-color:#5a4a1d;background:linear-gradient(90deg,#221e12,var(--card))}
.task.done{opacity:.5}.task.done .tt{text-decoration:line-through}
.chk{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);background:none;flex-shrink:0;display:grid;place-items:center;color:#0d0f14;font-weight:700;cursor:pointer;font-size:16px}
.done .chk{background:var(--acc);border-color:var(--acc)}
.tt{font-weight:600;font-size:15px}
.ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--card2);font-size:18px;flex-shrink:0}
button{font-family:inherit}
.btn{background:var(--acc);color:#0d0f14;border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.mini{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:9px;width:34px;height:34px;font-size:18px;cursor:pointer;flex-shrink:0}
.pun{border-color:#5c2430;background:linear-gradient(135deg,#2a1218,#1a1116)}
.pun .tt{color:#ffb3bc}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(13,15,20,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:20}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;background:none;border:0;color:var(--mut);padding:9px 4px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer}
.seg button.on{background:var(--card2);color:var(--tx)}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.item .iv{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--card2)}
.item .in{font-size:12px;font-weight:600}.item .btn{width:100%;margin-top:auto}
.item.eq{border-color:var(--acc)}.item.lock{opacity:.55}
.lb{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:11px}
.lb .rk{width:26px;text-align:center}.lb .av{font-size:24px}
.lb.me{background:var(--card2);outline:1px solid var(--acc)}
.lb.up{box-shadow:inset 3px 0 0 var(--acc)}.lb.down{box-shadow:inset 3px 0 0 var(--red)}
button:disabled{opacity:.6}
.big-n{font-size:34px;font-weight:700;letter-spacing:-.01em}
.mv{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.mv:last-child{border:0}
.pos{color:var(--acc)}.neg{color:var(--tx)}
.nav button{background:none;border:0;color:var(--mut);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 4px;cursor:pointer;position:relative}
.nav button span{font-size:20px}
.nav button.on{color:var(--acc)}
.dot{position:absolute;top:0;right:6px;background:var(--red);color:#fff;font-size:10px;border-radius:99px;padding:0 5px;font-weight:700}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.day{flex:1;min-width:44px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer;color:var(--tx)}
.day small{display:block;font-size:10px;color:var(--mut)}.day b{font-size:17px}
.day.on{background:var(--acc);color:#0d0f14;border-color:var(--acc)}.day.on small{color:#2c3a10}
.day.today:not(.on){border-color:var(--acc)}
.day i{display:block;height:3px;border-radius:2px;margin:5px 8px 0;background:var(--line)}
.banner{border-radius:16px;padding:14px;margin-bottom:10px;background:linear-gradient(135deg,#2a2160,#1a1838);border:1px solid #3d3484}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;border-top:1px solid var(--line)}
.sheet h3{margin:0 0 12px;font-size:19px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:11px;padding:11px;font-family:inherit;font-size:15px}
textarea{min-height:150px;font-size:13px;font-family:ui-monospace,monospace}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wk{display:flex;gap:4px}.wk label{flex:1;margin:0;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 0;cursor:pointer;color:var(--tx);font-size:12px}
.wk input{display:none}.wk input:checked+span{color:var(--acc);font-weight:700}
.tog{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px;margin-top:10px;cursor:pointer}
.tog input{width:auto}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-150%);background:var(--card2);border:1px solid var(--line);padding:12px 16px;border-radius:14px;z-index:99;transition:.35s;max-width:92%;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.on{transform:translateX(-50%) translateY(0)}
.water{display:flex;gap:5px;margin-top:8px}
.water span{flex:1;height:26px;border-radius:7px;background:var(--bg);border:1px solid var(--line)}
.water span.f{background:var(--blue);border-color:var(--blue)}
.pomo{text-align:center}
.pomo b{font-size:44px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.chart{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:8px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--mut);gap:4px}
.chart i{width:100%;background:var(--acc2);border-radius:6px 6px 2px 2px;min-height:3px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;font-size:11px;color:var(--mut)}
.badge b{font-size:24px;display:block;filter:grayscale(1);opacity:.35}
.badge.on{color:var(--tx);border-color:#5a4a1d}.badge.on b{filter:none;opacity:1}
.empty{text-align:center;color:var(--mut);padding:20px;font-size:14px}
.cnt{font-size:22px;font-weight:700;min-width:44px;text-align:center}
.over{color:var(--red)}
.lnk{background:none;border:0;color:var(--acc);font-size:13px;cursor:pointer;padding:0;font-weight:600;text-transform:none;letter-spacing:0}
.del{background:none;border:0;color:var(--mut);font-size:16px;cursor:pointer;padding:4px}
code{background:var(--bg);padding:1px 5px;border-radius:5px;font-size:12px}

.hero{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#1d2335,#141821);border:1px solid var(--line);border-radius:22px;padding:14px}
.lvl{width:76px;height:76px;border-radius:50%;position:relative;flex-shrink:0}
.lvi{position:absolute;inset:5px;border-radius:50%;background:#171b26;display:grid;place-items:center;font-size:36px}
.lvl em{position:absolute;bottom:-4px;right:-4px;background:var(--acc);color:#0d0f14;font-style:normal;font-weight:700;font-size:13px;min-width:26px;height:26px;border-radius:13px;display:grid;place-items:center;border:3px solid var(--bg)}
.help{margin-left:auto;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--mut);font-weight:700;cursor:pointer}
.chips{display:flex;gap:6px;margin-top:8px}.chips span{background:#0d0f14aa;border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-size:12px;font-weight:600}
.dayc{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:12px}
.dring,.pring,.donut{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;position:relative}
.dring>div,.pring>div,.donut>div{position:absolute;inset:11px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut>div{background:#171b26}
.dring b{font-size:28px}.dring small,.pring small,.donut small{font-size:11px;color:var(--mut)}
.pring{width:170px;height:170px;margin:4px auto 0}.pring>div{inset:12px}.pring b{font-size:40px;font-variant-numeric:tabular-nums}
.donut{width:96px;height:96px}.donut>div{inset:14px}.donut b{font-size:14px}
.dl{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:2px}.dl b{font-size:15px}
.mbar{height:7px;background:#0a0c10;border-radius:9px;overflow:hidden;margin:5px 0 8px}.mbar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .5s}
.qrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.qa{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 4px;color:var(--tx);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:transform .1s}
.qa span{font-size:26px}.qa:active,.ht:active,.chk:active,.btn:active,.fbt:active{transform:scale(.93)}
.now{margin-top:14px;border-radius:22px;padding:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--c,#b6f24a) 22%,#161a22),#161a22 70%);border:1px solid color-mix(in srgb,var(--c,#b6f24a) 45%,transparent)}
.tlw{position:relative}
.tl{display:flex;gap:8px;align-items:stretch}
.tm{width:42px;font-size:12px;color:var(--mut);padding-top:16px;text-align:right;font-variant-numeric:tabular-nums}
.rail{width:14px;position:relative;display:flex;justify-content:center}.rail:before{content:'';position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.rail i{width:12px;height:12px;border-radius:50%;margin-top:18px;position:relative}
.tcard{flex:1;display:flex;gap:10px;align-items:center;padding:11px;border-radius:16px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);margin-bottom:8px;min-width:0}
.tcard.isbig{background:linear-gradient(90deg,#2a2412,var(--card));border-color:#5a4a1d;border-left-color:var(--gold)}
.tl.done .tcard{opacity:.5}.tl.done .tt{text-decoration:line-through}
.tl.done .chk{background:var(--acc);border-color:var(--acc)}
.tcard .tt{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.punbox{margin-top:12px;border-radius:20px;padding:14px;background:linear-gradient(135deg,#3a1520,#1c1117);border:1px solid #6a2836;animation:pulse 2s infinite}
.pun{display:flex;gap:8px;align-items:center;background:#0d0f1488;border-radius:12px;padding:10px;margin-top:8px}.pun .tt{color:#ffc2c9;font-size:15px}
@keyframes pulse{50%{box-shadow:0 0 0 4px #ff5a6a22}}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ht{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 4px 10px;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:transform .1s}
.ht.ok{border-color:#3c5418;background:linear-gradient(180deg,#1c2412,var(--card))}
.hr{width:62px;height:62px;border-radius:50%;position:relative}.hri{position:absolute;inset:6px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:26px}
.ht.ok .hri{background:#1c2412}
.hn{font-size:12px;font-weight:600;text-align:center;line-height:1.2}.hv{font-size:11px;color:var(--mut)}.ht.ok .hv{color:var(--acc)}
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gauge{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.gauge.gover{border-color:#6a2836;background:linear-gradient(180deg,#2a1218,var(--card))}.gauge.gok{border-color:#3c5418}
.gh{font-size:13px;font-weight:600}.gs{font-size:12px;margin-top:6px}
.arc{width:130px;height:65px;margin:10px auto 0;border-radius:130px 130px 0 0;position:relative;overflow:hidden;background:conic-gradient(from 270deg at 50% 100%,var(--gc) 0 var(--p),#0a0c10 var(--p) 180deg,transparent 180deg)}
.arcin{position:absolute;left:14px;right:14px;bottom:0;top:14px;border-radius:110px 110px 0 0;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.gover .arcin{background:#231319}.arcin b{font-size:26px;line-height:1}.arcin small{font-size:10px;color:var(--mut)}
.mini.plus{background:var(--acc);color:#0d0f14;border:0;font-weight:700}
.bigbtn{width:96px;height:96px;border-radius:50%;margin:12px auto 0;display:grid;place-items:center;font-size:40px;background:var(--card2);border:3px dashed var(--line);color:var(--tx);cursor:pointer}
.bigbtn.on{background:var(--acc);border:0;color:#0d0f14;font-weight:700}
.wkc{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.wd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 2px;color:var(--tx);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.wd small{font-size:10px;color:var(--mut)}.wd b{font-size:15px}.wd.on{border-color:var(--acc);background:#1c2412}.wd.today small{color:var(--acc)}
.wb{height:56px;width:12px;background:#0a0c10;border-radius:6px;display:flex;align-items:flex-end;overflow:hidden;margin-bottom:4px}
.wb i{display:flex;align-items:flex-end;width:100%;background:#2a3042;border-radius:6px}.wb u{display:block;width:100%;background:var(--acc);border-radius:6px}
.rut{display:flex;gap:10px;align-items:center;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);margin-bottom:8px}
.wdots{display:flex;gap:3px;margin-top:5px}.wdots span{width:20px;height:20px;border-radius:6px;font-size:10px;display:grid;place-items:center;background:#0a0c10;color:var(--mut)}.wdots span.on{background:var(--c);color:#0d0f14;font-weight:700}
.hmap{padding:12px}.hmrow{display:grid;grid-template-columns:28px repeat(7,1fr);gap:5px;align-items:center;margin-bottom:5px;text-align:center}.hmrow small{font-size:10px;color:var(--mut)}
.hmrow i{height:24px;border-radius:7px;display:block}
.cdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--acc);color:#0d0f14;font-size:32px;font-weight:600;border:0;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:30;cursor:pointer}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fbt{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px 4px;color:var(--tx);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}.fbt span{font-size:30px}
.fxp{position:fixed;transform:translate(-50%,-50%);font-weight:700;color:var(--acc);font-size:18px;pointer-events:none;z-index:100;animation:fup 1.1s ease-out forwards;text-shadow:0 2px 8px #000}
@keyframes fup{to{transform:translate(-50%,-160%);opacity:0}}
.cfx{position:fixed;inset:0;pointer-events:none;z-index:120}
.lvbig{font-size:80px;animation:pop .6s}@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.2)}}
.obic{font-size:72px;margin:6px 0 4px;animation:pop .5s}
.obd{display:flex;gap:6px;justify-content:center;margin:18px 0}.obd i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:.3s}.obd i.on{width:22px;background:var(--acc)}
.chk{transition:transform .1s}
.quote{margin-top:10px;font-size:13px;color:var(--mut);font-style:italic;text-align:center;padding:0 10px}
.banner.night{background:linear-gradient(135deg,#1c1d48,#141530);border-color:#34368a;margin-top:12px}
.banner.off{background:linear-gradient(135deg,#123028,#10201b);border-color:#1f5c48;margin-top:12px}
.offlink{display:block;width:100%;margin-top:14px;background:none;border:1px dashed var(--line);color:var(--mut);border-radius:14px;padding:12px;font-size:13px;cursor:pointer;font-family:inherit}
.t3e{display:flex;gap:12px;align-items:center;margin-top:14px;padding:14px;border-radius:18px;background:var(--card);border:1px dashed #4a5370}
.p3{display:flex;gap:10px;align-items:center;padding:8px 4px}.p3+.p3{border-top:1px solid var(--line)}
.pn{width:26px;height:26px;border-radius:50%;background:var(--acc2);color:#0d0f14;font-weight:700;display:grid;place-items:center;font-size:13px;flex-shrink:0}
.p3.done .tt{text-decoration:line-through;opacity:.5}.p3.done .chk{background:var(--acc);border-color:var(--acc)}
.picks{display:flex;gap:6px}.picks button{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 0;font-size:24px;cursor:pointer;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
.picks button small{font-size:11px;color:var(--mut)}.picks button.on{border-color:var(--acc);background:#1c2412}.picks button.on small{color:var(--acc)}
.picks.big{display:grid;grid-template-columns:1fr 1fr}.picks.big button{font-size:30px;padding:14px 0}
.chipb{background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:99px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:inherit}

.obw{text-align:center;padding:2px 2px 4px}.obd2{font-size:14.5px;line-height:1.55;margin-bottom:14px}.obd2 b{color:var(--tx)}
.obv{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:4px}
.obv .tl{margin:0}.obv .tcard{margin:0}.obv .tm{padding-top:12px}.obv .rail i{margin-top:14px}
.obpulse{background:var(--acc)!important;border-color:var(--acc)!important;animation:obp 1.4s infinite}@keyframes obp{50%{transform:scale(1.15);box-shadow:0 0 0 6px #b6f24a33}}
.obhint{font-size:12px;color:var(--acc);margin-top:8px;text-align:left;padding-left:70px}
.obstep{display:flex;gap:12px;align-items:center;padding:8px 0}.obstep+.obstep{border-top:1px solid var(--line)}.obstep>span{font-size:26px}.obstep .mut{font-size:12px}
#tour{position:fixed;inset:0;z-index:200}
.tbox{position:fixed;border-radius:18px;box-shadow:0 0 0 9999px rgba(5,6,10,.8);border:2px solid var(--acc);transition:all .3s;pointer-events:none}
.ttip{position:fixed;left:16px;right:16px;max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 12px 40px #000}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="wrap" id="app"></div>

<nav class="nav" id="nav">
  <button data-tab="hoy" class="on"><span>⚡</span>Hoy</button>
  <button data-tab="semana"><span>📅</span>Semana</button>
  <button data-tab="habitos"><span>💧</span>Hábitos</button>
  <button data-tab="limites"><span>🚫</span>Límites</button>
  <button data-tab="dinero"><span>💶</span>Dinero</button>
  <button data-tab="liga"><span>🏆</span>Liga</button>
</nav>

<button class="fab" data-act="fab">+</button>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return fmt(d)};
const today=()=>fmt(new Date());
const monOf=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return fmt(d)};
const wd=s=>(pd(s).getDay()+6)%7; // 0=lunes
const DN=['L','M','X','J','V','S','D'];
const DL=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS={estudio:'📚',test:'📝',repaso:'🔁',coche:'🚗',gym:'🏋️',otro:'⭐'};
const PUNISH={
  suave:['15 flexiones','20 sentadillas','Plancha 45 s','+15 min de estudio extra'],
  normal:['25 flexiones','40 sentadillas','3 × plancha 1 min','+30 min de estudio extra','15 burpees','Test extra de 20 preguntas','Sin redes sociales 2 h'],
  duro:['50 flexiones','80 sentadillas','30 burpees','+1 h de estudio extra','Test extra de 50 preguntas','Sin móvil ni redes 4 h']
};

/* ============ estado ============ */
const KEY='opoquest-v1';
let S;
function seed(){
  const t=today(),m=monOf(t);
  const s={xp:340,examDate:addD(t,180),examName:'Oposiciones',intensity:'normal',lastProc:addD(t,-1),
    tasks:[],routines:[],punishments:[],habitLog:{},limitLog:{},notified:{},bestStreak:4,doneTotal:23,pomos:0,
    habits:[
      {id:'agua',name:'Beber 1 L de agua',icon:'💧',target:4,unit:'vasos de 250 ml',remind:'11:00'},
      {id:'supl',name:'Tomar suplementación',icon:'💊',target:1,unit:'toma',remind:'09:00'},
      {id:'sueno',name:'Dormir 7 h o más',icon:'😴',target:1,unit:'',remind:''},
      {id:'mov',name:'30 min de ejercicio',icon:'🏃',target:1,unit:'',remind:'19:00'},
      {id:'leer',name:'Repasar esquemas antes de dormir',icon:'🧠',target:1,unit:'',remind:'22:30'}
    ],
    limits:[
      {id:'tabaco',name:'Tabaco',icon:'🚬',type:'max',max:5,period:'day',unit:'cigarros'},
      {id:'fiesta',name:'Salir de fiesta',icon:'🎉',type:'max',max:1,period:'week',unit:'salidas'},
      {id:'casa',name:'Salir de casa (mín. 30 min)',icon:'🚪',type:'min',max:1,period:'day',unit:'',remind:'18:00'},
      {id:'pantalla',name:'Redes sociales',icon:'📱',type:'max',max:60,period:'day',unit:'min',step:15}
    ]};
  s.routines=[
    {id:'r1',title:'Prácticas de coche',cat:'coche',days:[1,3],time:'17:00',dur:60,big:true},
    {id:'r2',title:'Gimnasio',cat:'gym',days:[0,2,4],time:'19:30',dur:60,big:false}
  ];
  const plan=[[0,'09:00',120,'Tema 4 · Constitución: derechos fundamentales','estudio',true],[0,'16:00',45,'Test tema 3','test'],
    [1,'09:00',120,'Tema 5 · El Gobierno','estudio'],[1,'12:00',30,'Repaso esquemas T1-T3','repaso'],
    [2,'09:00',150,'Tema 6 · Poder judicial','estudio',true],[2,'16:00',60,'Simulacro 50 preguntas','test',true],
    [3,'09:00',120,'Tema 7 · Organización territorial','estudio'],[4,'09:00',90,'Tema 8 · Unión Europea','estudio'],
    [4,'12:00',45,'Test temas 4-6','test'],[5,'10:00',180,'Simulacro completo','test',true],[6,'11:00',60,'Repaso semanal','repaso']];
  plan.forEach(([d,time,dur,title,cat,big])=>{const date=addD(m,d);
    s.tasks.push({id:uid(),date,time,dur,title,cat,big:!!big,done:date<t,fromPlan:true,week:m});});
  s.punishments.push({id:uid(),text:'25 flexiones',reason:'Ayer no completaste «Test tema 3» (agrandada)',date:addD(t,-1),done:false});
  s.habitLog[t]={agua:1};
  s.limitLog[t]={tabaco:2};
  s.money=seedMoney();
  return s;
}
function seedMoney(){const ym=today().slice(0,7),D=n=>ym+'-'+pad(Math.min(n,+today().slice(8)));
  const m={budget:700,cigPrice:0.30,overFlag:{},fixedDone:{},
    cats:{comida:{i:'🛒',n:'Comida',b:250},transporte:{i:'⛽',n:'Transporte',b:60},formacion:{i:'🎓',n:'Academia / temario',b:150},
      autoescuela:{i:'🚗',n:'Autoescuela',b:120},salud:{i:'💊',n:'Salud / suplementos',b:60},ocio:{i:'🎉',n:'Ocio / fiesta',b:100},
      tabaco:{i:'🚬',n:'Tabaco',b:40},otros:{i:'📦',n:'Otros',b:50}},
    fixed:[{id:'f1',name:'Academia oposiciones',amt:120,cat:'formacion',day:1},{id:'f2',name:'Bono prácticas autoescuela',amt:90,cat:'autoescuela',day:5},{id:'f3',name:'Gimnasio',amt:30,cat:'salud',day:1}],
    goals:[{id:'g1',name:'Tasas del examen + viaje',icon:'🎯',target:150,saved:60},{id:'g2',name:'Colchón de emergencia',icon:'🛟',target:1000,saved:220}],
    moves:[]};
  [[1,'in',950,'ingreso','Ingreso mensual'],[3,'out',62.4,'comida','Compra semanal'],[6,'out',24,'salud','Creatina + multivitamínico'],
   [8,'out',35,'ocio','Cena con amigos'],[9,'out',58.1,'comida','Compra semanal'],[11,'out',40,'transporte','Gasolina'],
   [13,'out',18.9,'formacion','Libro de test'],[14,'out',5.5,'tabaco','Tabaco'],[15,'out',48,'ocio','Fiesta sábado']]
   .forEach(([d,type,amt,cat,note])=>m.moves.push({id:uid(),date:D(d),type,amt,cat,note}));
  return m}
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return seed()}
function save(){S.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(typeof dbSaveSoon==='function')dbSaveSoon()}
function migrate(){const D={coins:180,inv:{freeze:1,pardon:0},owned:['av_pollito','th_lima'],avatar:'av_pollito',theme:'th_lima',
  wk:{m:monOf(today()),xp:185},league:1,friends:[],nick:'Carlos',claimed:{},strict:false,frozen:{},savedAt:0,boostUntil:0,top3:{},journal:{},offDays:{},srs:true};
  for(const k in D)if(S[k]===undefined)S[k]=D[k];if(!S.money)S.money=seedMoney()}
S=load();migrate();

/* ============ nivel / xp ============ */
const lvlOf=xp=>Math.max(1,Math.floor(Math.max(0,xp)/100)+1);
const TITLES=['Novato','Aprendiz','Constante','Disciplinado','Opositor','Veterano','Imparable','Élite','Leyenda','Funcionario'];
const titleOf=l=>TITLES[Math.min(TITLES.length-1,Math.floor((l-1)/2))];
const taskXP=t=>Math.round((10+t.dur/6)*(t.big?2:1));
function gain(n,msg){ensureWeek();if(n>0&&Date.now()<S.boostUntil)n*=2;if(n>0)S.coins+=n;S.wk.xp+=n;pushBoardSoon();const before=lvlOf(S.xp);S.xp=Math.max(0,S.xp+n);const after=lvlOf(S.xp);
  if(n)floatXP(n);if(after>before)setTimeout(()=>levelUp(after),350);
  else if(after<before)toast(`📉 Bajas a nivel ${after}. ¡Recupéralo!`);
  else if(msg)toast(msg);}

/* ============ rutinas fijas ============ */
function ensureRoutines(date){
  S.routines.forEach(r=>{if(!r.days.includes(wd(date)))return;
    if(S.tasks.some(t=>t.rid===r.id&&t.date===date))return;
    S.tasks.push({id:uid(),rid:r.id,date,time:r.time,dur:r.dur,title:r.title,cat:r.cat,big:r.big,done:false});});
}
const tasksOn=d=>{ensureRoutines(d);return S.tasks.filter(t=>t.date===d).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'))};

/* ============ cierre de días (castigos) ============ */
function weekCount(id,date){const m=monOf(date);let c=0;for(let i=0;i<7;i++){c+=(S.limitLog[addD(m,i)]||{})[id]||0}return c}
function punish(reason,date){const pool=PUNISH[S.intensity];
  S.punishments.push({id:uid(),text:pool[Math.floor(Math.random()*pool.length)],reason,date,done:false});}
function processDays(){
  const t=today();let d=addD(S.lastProc,1),lost=0,news=0,frz=0;
  while(d<t){if(S.offDays[d]){S.lastProc=d;d=addD(d,1);continue}let L=0;const P=[];const pz=r=>P.push(r);
    tasksOn(d).forEach(k=>{if(k.done)return;L+=k.big?40:15;if(k.big)pz(`No completaste «${k.title}» (agrandada)`)});
    const pend=tasksOn(d).filter(k=>!k.done&&!k.big).length;if(pend>=2)pz(`Dejaste ${pend} tareas sin hacer`);
    const hl=S.habitLog[d]||{};let missH=0;S.habits.forEach(h=>{if((hl[h.id]||0)<h.target){L+=10;missH++}});
    if(missH>=3)pz(`Fallaste ${missH} hábitos`);
    const ll=S.limitLog[d]||{};
    S.limits.forEach(l=>{
      if(l.type==='min'&&(ll[l.id]||0)<l.max){L+=10;pz(`No cumpliste: ${l.name}`)}
      if(l.type==='max'&&l.period==='day'&&(ll[l.id]||0)>l.max){L+=20;pz(`Te pasaste del límite: ${l.name}`)}});
    if(wd(d)===6)S.limits.forEach(l=>{if(l.type==='max'&&l.period==='week'&&weekCount(l.id,d)>l.max){L+=25;pz(`Te pasaste del límite semanal: ${l.name}`)}});
    if((L||P.length)&&S.inv.freeze>0){S.inv.freeze--;S.frozen[d]=1;frz++}
    else{lost+=L;P.forEach(r=>{punish(r,d);news++})}
    S.punishments.forEach(p=>{if(!p.done&&!p.doubled&&p.date<=addD(d,-2)){p.doubled=true;p.text+=' (×2)';news++}});
    S.lastProc=d;d=addD(d,1);
  }
  if(frz)setTimeout(()=>toast(`🧊 Tu escudo de racha te ha salvado ${frz} día(s)`),400);
  if(lost){const b=lvlOf(S.xp);S.xp=Math.max(0,S.xp-lost);ensureWeek();S.wk.xp-=lost;save();
    setTimeout(()=>toast(`⚠️ Días pendientes: −${lost} XP${news?` y ${news} castigo(s)`:''}${lvlOf(S.xp)<b?' · ¡Has bajado de nivel!':''}`),900);}
}

/* ============ racha ============ */
function dayScore(d){const ts=tasksOn(d);const h=S.habits;const hl=S.habitLog[d]||{};
  const tot=ts.length+h.length;if(!tot)return 1;
  return (ts.filter(x=>x.done).length+h.filter(x=>(hl[x.id]||0)>=x.target).length)/tot}
function streak(){let c=0,d=addD(today(),-1);for(let i=0;i<365;i++){if(S.frozen[d]||S.offDays[d]||dayScore(d)>=.8){c++;d=addD(d,-1)}else break}
  if(S.offDays[today()]||dayScore(today())>=.8)c++;if(c>S.bestStreak){S.bestStreak=c;save()}return c}

/* ============ notificaciones ============ */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),3200)}
function notify(title,body){toast(`🔔 ${title}${body?' — '+body:''}`);
  try{navigator.vibrate&&navigator.vibrate([150,80,150])}catch(e){}
  try{if(window.Notification&&Notification.permission==='granted'){if(navigator.serviceWorker&&navigator.serviceWorker.controller)navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:'icons/icon-192.png',badge:'icons/icon-192.png',vibrate:[150,80,150]}));else new Notification(title,{body,icon:'icons/icon-192.png'})}}catch(e){}}
function tick(){
  const now=new Date(),hm=pad(now.getHours())+':'+pad(now.getMinutes()),t=today();
  const once=(k,f)=>{if(S.notified[k])return;S.notified[k]=1;save();f()};
  tasksOn(t).forEach(k=>{if(!k.done&&k.time&&k.time<=hm&&k.time>=pad(now.getHours()-1)+':'+pad(now.getMinutes()))once(t+k.id,()=>notify(`Toca: ${k.title}`,'Márcala al terminar ✔'))});
  S.habits.forEach(h=>{if(h.remind&&h.remind<=hm&&((S.habitLog[t]||{})[h.id]||0)<h.target)once(t+h.id,()=>notify(`${h.icon} ${h.name}`,'Aún sin marcar'))});
  S.limits.forEach(l=>{if(l.remind&&l.remind<=hm&&((S.limitLog[t]||{})[l.id]||0)<l.max)once(t+l.id,()=>notify(`${l.icon} ${l.name}`,'Llevas mucho en casa: sal y márcalo'))});
  if(wd(t)===6&&now.getHours()>=20&&!S.tasks.some(k=>k.fromPlan&&k.week===addD(monOf(t),7)))once(t+'plan',()=>notify('📥 Domingo noche','Sube el plan de tu preparador'));
  if(hm>='21:30'&&!S.journal[t])once(t+'cierre',()=>notify('🌙 Cierre del día','2 minutos para cerrar el día y planear mañana'));
  if(hm>='08:30'&&hm<'12:00'&&!(S.top3[t]||[]).length)once(t+'top3',()=>notify('🎯 Buenos días','Elige tus 3 prioridades de hoy'));
  const p=S.punishments.filter(x=>!x.done).length;
  if(p&&now.getHours()>=21)once(t+'pun',()=>notify(`💪 Tienes ${p} castigo(s) pendientes`,'Cúmplelos antes de dormir'));
}

/* ============ vistas ============ */
let TAB='hoy',SEL=today(),pomo={left:25*60,run:false,mode:'foco',h:null};
const CATC={estudio:'#8b7bff',test:'#ffc94a',repaso:'#4ac6ff',coche:'#ff7a3d',gym:'#3dff7a',otro:'#b6f24a'};
const SHORT={agua:'Agua 1 L',supl:'Suplementos',sueno:'Dormir 7 h',mov:'Ejercicio',leer:'Repaso noche'};
const ring=(p,c,bg='#0a0c10')=>`background:conic-gradient(${c} ${Math.round(Math.min(1,Math.max(0,p))*360)}deg,${bg} 0)`;
function heroHTML(){const l=lvlOf(S.xp),into=S.xp%100,st=streak(),[li]=LEAGUES[S.league];
  const days=Math.max(0,Math.round((pd(S.examDate)-pd(today()))/864e5));
  return `<div class="hero"><div class="lvl" style="${ring(into/100,'var(--acc)')}"><div class="lvi"><span>${itemOf(S.avatar).v}</span></div><em>${l}</em></div>
  <div class="sp"><div class="row" style="gap:6px"><b style="font-size:18px">${esc(S.nick)}</b><span class="mut">· ${titleOf(l)}</span><button class="help" data-act="help">?</button></div>
  <div class="bar"><i style="width:${into}%"></i></div><div class="mut" style="font-size:12px;margin-top:4px">${into}/100 XP para nivel ${l+1}${Date.now()<S.boostUntil?' · <b style="color:var(--gold)">⚡×2</b>':''}</div>
  <div class="chips"><span>🔥 ${st}</span><span style="color:var(--gold)">🪙 ${S.coins}</span><span>${li}</span><span>📅 ${days} d</span></div></div></div>`}
function taskHTML(k){const c=CATC[k.cat]||'#b6f24a';return `<div class="tl ${k.done?'done':''}"><div class="tm">${k.time||'—'}</div><div class="rail"><i style="background:${k.done?'var(--acc)':c};box-shadow:0 0 0 4px ${c}22"></i></div>
  <div class="tcard ${k.big?'isbig':''}" style="--c:${c}"><button class="chk" data-act="toggle" data-id="${k.id}">${k.done?'✓':''}</button>
  <div class="sp"><div class="tt">${CATS[k.cat]||'⭐'} ${esc(k.title)}</div><div class="mut" style="font-size:12px">${k.dur} min · +${taskXP(k)} XP${k.big?' · <b style="color:var(--gold)">⭐ agrandada</b>':''}${k.rid?' · 🔁':''}${k.fromPlan?' · 📥':''}</div></div>
  <button class="del" data-act="menu" data-id="${k.id}">⋯</button></div></div>`}
function punHTML(){const p=S.punishments.filter(x=>!x.done);if(!p.length)return'';
  return `<div class="punbox"><div class="row"><div style="font-size:30px">💪</div><div class="sp"><b>Castigos pendientes: ${p.length}</b><div class="mut" style="font-size:12px">Cúmplelos y recuperas +10 XP cada uno. Si pasan 2 días, se duplican.</div></div></div>`
  +p.map(x=>`<div class="pun"><div class="sp"><div class="tt">${esc(x.text)}</div><div class="mut" style="font-size:12px">${esc(x.reason)}</div></div>
  ${S.inv.pardon>0?`<button class="btn sm ghost" data-act="pardon" data-id="${x.id}">🎟️</button>`:''}<button class="btn sm red" data-act="pundone" data-id="${x.id}">Hecho</button></div>`).join('')+`</div>`}
function habitHTML(h,d){const v=(S.habitLog[d]||{})[h.id]||0,ok=v>=h.target,p=v/h.target;
  return `<button class="ht ${ok?'ok':''}" data-act="habtap" data-id="${h.id}"><div class="hr" style="${ring(p,ok?'var(--acc)':'var(--blue)')}"><div class="hri">${h.icon}</div></div>
  <div class="hn">${esc(h.short||SHORT[h.id]||h.name)}</div><div class="hv">${ok?'✓ hecho':h.target>1?`${v}/${h.target}`:'toca aquí'}</div></button>`}
function limitHTML(l,d){const v=l.period==='week'?weekCount(l.id,d):((S.limitLog[d]||{})[l.id]||0);
  if(l.type==='min'){const ok=v>=l.max;return `<div class="gauge ${ok?'gok':''}"><div class="gh">${l.icon} ${esc(l.name.replace(/ \(.*\)/,''))}</div>
    <button class="bigbtn ${ok?'on':''}" data-act="lim" data-id="${l.id}" data-n="${ok?-1:1}">${ok?'✓':'🚪'}</button><div class="mut gs">${ok?'¡Hecho hoy!':'Toca cuando salgas'}</div></div>`}
  const p=v/l.max,over=v>l.max,col=over?'var(--red)':p>=.7?'var(--gold)':'var(--acc)';
  return `<div class="gauge ${over?'gover':''}"><div class="gh">${l.icon} ${esc(l.name)}</div>
  <div class="arc" style="--p:${Math.min(180,p*180)}deg;--gc:${col}"><div class="arcin"><b style="color:${over?'var(--red)':'var(--tx)'}">${v}</b><small>de ${l.max} ${esc(l.unit)}</small></div></div>
  <div class="row" style="justify-content:center;gap:14px;margin-top:8px"><button class="mini" data-act="lim" data-id="${l.id}" data-n="-${l.step||1}">−</button><button class="mini plus" data-act="lim" data-id="${l.id}" data-n="${l.step||1}">+</button></div>
  <div class="mut gs ${over?'over':''}">${over?'⚠️ Te has pasado':l.period==='week'?'por semana':'por día'}</div></div>`}
function nextTask(ts){const now=new Date(),hm=pad(now.getHours())+':'+pad(now.getMinutes());const p=ts.filter(k=>!k.done);
  return p.find(k=>!k.time||k.time>=pad(Math.max(0,now.getHours()-2))+':00')||p[0]}
function vHoy(){const t=today(),ts=tasksOn(t),dn=ts.filter(x=>x.done).length,hl=S.habitLog[t]||{},hd=S.habits.filter(h=>(hl[h.id]||0)>=h.target).length;
  const sc=dayScore(t),nx=nextTask(ts),sun=wd(t)===6&&!S.tasks.some(k=>k.fromPlan&&k.week===addD(monOf(t),7));
  const tot=pomo.mode==='foco'?1500:300,pm=Math.floor(pomo.left/60),ps=pomo.left%60;
  const q=(ic,lb,act,extra)=>`<button class="qa" data-act="${act}" ${extra}><span>${ic}</span>${lb}</button>`;

let LXY=[innerWidth/2,innerHeight/2];
function floatXP(n){const d=document.createElement('div');d.className='fxp';d.textContent=(n>0?'+':'')+n+' XP';if(n<0)d.style.color='var(--red)';
  d.style.left=LXY[0]+'px';d.style.top=LXY[1]+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1100)}
function confetti(){const c=document.createElement('canvas');c.className='cfx';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
  const x=c.getContext('2d'),cols=['#b6f24a','#8b7bff','#ffc94a','#4ac6ff','#ff5a6a'],P=[...Array(90)].map(()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*12,vy:Math.random()*-12-3,r:Math.random()*6+3,c:cols[Math.random()*5|0],a:Math.random()*6}));
  let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(++f<90)requestAnimationFrame(loop);else c.remove()})()}

const DMAP={lun:0,lunes:0,l:0,mar:1,martes:1,m:1,mie:2,'mié':2,miercoles:2,'miércoles':2,x:2,jue:3,jueves:3,j:3,vie:4,viernes:4,v:4,sab:5,'sáb':5,sabado:5,'sábado':5,s:5,dom:6,domingo:6,d:6};
function parsePlan(txt){txt=txt.trim();if(!txt)return[];
  if(txt[0]==='['||txt[0]==='{'){try{let j=JSON.parse(txt);j=Array.isArray(j)?j:(j.tareas||j.tasks||[]);
    return j.map(o=>({day:DMAP[String(o.dia??o.day??'').toLowerCase()]??0,time:o.hora||o.time||'',dur:+(o.min||o.duracion||o.dur||60),title:o.titulo||o.title||'Tarea',cat:o.tipo||o.cat||'estudio',big:!!(o.agrandada||o.big)}))}catch(e){return[]}}
  return txt.split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split(/[;,\t]|\s+/).filter(Boolean);const day=DMAP[(p[0]||'').toLowerCase().replace(/[.:]/g,'')];if(day===undefined)return null;
    let rest=l.slice(l.indexOf(p[0])+p[0].length).replace(/^[\s;,\t]+/,'');
    const tm=rest.match(/^(\d{1,2}[:.h]\d{2})[\s;,\t]*/);let time='';if(tm){time=tm[1].replace(/[.h]/,':').padStart(5,'0');rest=rest.slice(tm[0].length)}
    const dm=rest.match(/^(\d{1,3})\s*(min)?[\s;,\t]+/);let dur=60;if(dm){dur=+dm[1];rest=rest.slice(dm[0].length)}
    const big=/!\s*$/.test(rest);rest=rest.replace(/!\s*$/,'');
    const cm=rest.match(/#(\w+)/);const cat=cm&&CATS[cm[1].toLowerCase()]?cm[1].toLowerCase():'estudio';rest=rest.replace(/#\w+/,'').trim();
    return{day,time,dur,title:rest||'Tarea',cat,big}}).filter(Boolean)}

    case'addhab':openM(`<h3>Nuevo hábito</h3><label>Nombre</label><input id="hN" placeholder="Ej: Meditar 10 min"><div class="g2"><div><label>Emoji</label><input id="hI" value="✨"></div><div><label>Veces al día</label><input type="number" id="hT" value="1" min="1"></div></div><label>Recordatorio</label><input type="time" id="hR"><div class="row" style="gap:8px;margin-top:16px"><button class="btn ghost" style="flex:1" data-act="close">Cancelar</button><button class="btn" style="flex:2" data-act="savehab">Guardar</button></div>`);return;

    case'savefixed':{const n=$('#xN').value.trim(),a=+$('#xA').value;if(!n||!(a>0))return;S.money.fixed.push({id:uid(),name:n,amt:a,day:Math.min(28,Math.max(1,+$('#xD').value||1)),cat:$('#xC').value});applyFixed();closeM();break}
